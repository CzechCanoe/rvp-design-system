name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No labeled/unlabeled here: label events would start (and cancel real runs via concurrency)
    # skipped CI runs. The `skip-snapshots` label is handled by skip-snapshots-label.yml,
    # which dispatches this workflow.
    types: [opened, synchronize, reopened]
  # Dispatched by update-snapshots.yml and skip-snapshots-label.yml
  # (pushes/labels made with GITHUB_TOKEN do not trigger workflows).
  workflow_dispatch:
    inputs:
      skip_snapshots:
        description: Run Playwright with --ignore-snapshots (mirrors label skip-snapshots)
        required: false
        type: boolean
        default: false

# Newer runs of the same event on the same branch cancel older ones
# (dispatch and pull_request runs do not cancel each other; the newest dispatch wins).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Dispatched runs only: mark the head as pending so the PR shows the run is in progress
  # (see report-status at the end for why a commit status is used).
  start-status:
    name: Mark dispatched CI pending
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      statuses: write
    steps:
      - name: Post pending commit status on the head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending -f context="CI (dispatched run)" \
            -f description="Dispatched CI run in progress" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      CI: true
      # Label `skip-snapshots` on the PR (or dispatch input): functional tests only, no snapshot comparison
      SKIP_SNAPSHOTS: ${{ inputs.skip_snapshots == true || contains(github.event.pull_request.labels.*.name, 'skip-snapshots') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      # Tests tagged @prototype (render a prototype page) never compare snapshots until T17.
      - name: Run Playwright tests (snapshots compared)
        run: |
          FLAGS=""
          if [ "$SKIP_SNAPSHOTS" = "true" ]; then FLAGS="--ignore-snapshots"; echo "skip-snapshots active: running with --ignore-snapshots"; fi
          npx playwright test --project=chromium --grep-invert @prototype $FLAGS

      - name: Run Playwright tests (@prototype, snapshots ignored)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-prototypes
        run: npx playwright test --project=chromium --grep @prototype --ignore-snapshots

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-prototypes/
          retention-days: 1

  # The pull_request run for a commit pushed with GITHUB_TOKEN (update-snapshots bot commit) ends
  # `action_required` (the bot counts as a first-time contributor, repo setting "Require approval")
  # and the PR then shows no checks; check runs of a dispatched run are not linked to the PR.
  # Commit statuses are, so the dispatched run reports its result on the head SHA as a status.
  report-status:
    name: Report dispatched CI result
    runs-on: ubuntu-latest
    needs: [start-status, lint-and-typecheck, build, test]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      statuses: write
    steps:
      - name: Post commit status on the head
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # cancelled/skipped -> error so an older success on the same SHA cannot linger
          STATE=success
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              failure) [ "$STATE" = error ] || STATE=failure ;;
              *) STATE=error ;;
            esac
          done
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" -f context="CI (dispatched run)" \
            -f description="Dispatched CI run: $STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
