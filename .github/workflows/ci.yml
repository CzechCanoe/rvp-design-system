name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No labeled/unlabeled here: label events would start (and cancel real runs via concurrency)
    # skipped CI runs.
    types: [opened, synchronize, reopened]
  # Dispatched by update-snapshots.yml (pushes made with GITHUB_TOKEN do not trigger workflows).
  workflow_dispatch:

# Newer runs of the same event on the same branch cancel older ones
# (dispatch and pull_request runs do not cancel each other; the newest dispatch wins).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Dispatched runs only: mark the head as pending so the PR shows the run is in progress
  # (see report-status at the end for why a commit status is used).
  start-status:
    name: Mark dispatched CI pending
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      statuses: write
    steps:
      - name: Post pending commit status on the head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending -f context="CI (dispatched run)" \
            -f description="Dispatched CI run in progress" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Playwright on a PR runs only when files that can change rendering are touched
  # (pushes to main build only; dispatched runs always run Playwright).
  changes:
    name: Detect Playwright-relevant changes
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with the base branch
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|tests/|\.storybook/|package(-lock)?\.json$|playwright\.config\.ts$|\.github/workflows/)'; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Playwright-relevant changes; skipping the Playwright job."
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.playwright == 'true') ||
      github.event_name == 'workflow_dispatch'
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Playwright tests (snapshots compared)
        run: npx playwright test --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

  # The pull_request run for a commit pushed with GITHUB_TOKEN (update-snapshots bot commit) ends
  # `action_required` (the bot counts as a first-time contributor, repo setting "Require approval")
  # and the PR then shows no checks; check runs of a dispatched run are not linked to the PR.
  # Commit statuses are, so the dispatched run reports its result on the head SHA as a status.
  report-status:
    name: Report dispatched CI result
    runs-on: ubuntu-latest
    needs: [start-status, lint-and-typecheck, build, test]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      statuses: write
    steps:
      - name: Post commit status on the head
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # cancelled/skipped -> error so an older success on the same SHA cannot linger
          STATE=success
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              failure) [ "$STATE" = error ] || STATE=failure ;;
              *) STATE=error ;;
            esac
          done
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" -f context="CI (dispatched run)" \
            -f description="Dispatched CI run: $STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
