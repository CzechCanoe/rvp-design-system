name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by update-snapshots.yml after it pushes a snapshot commit
  # (pushes made with GITHUB_TOKEN do not trigger workflows).
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      CI: true
      # Label `skip-snapshots` on the PR: functional tests only, no snapshot comparison
      SKIP_SNAPSHOTS: ${{ contains(github.event.pull_request.labels.*.name, 'skip-snapshots') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      # Prototype snapshots are not compared until T17, so prototypes always run with --ignore-snapshots.
      - name: Run Playwright tests (all specs except prototypes)
        run: |
          FLAGS=""
          if [ "$SKIP_SNAPSHOTS" = "true" ]; then FLAGS="--ignore-snapshots"; fi
          npx playwright test --project=chromium $FLAGS \
            tests/accessibility.spec.ts tests/components.spec.ts tests/container-queries.spec.ts \
            tests/cross-browser.spec.ts tests/interactions.spec.ts

      - name: Run Playwright tests (prototypes, snapshots ignored)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-prototypes
        run: npx playwright test tests/prototypes.spec.ts --project=chromium --ignore-snapshots

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-prototypes/
          retention-days: 1
