name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: only `skip-snapshots` matters (see the if: condition on each job)
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Dispatched by update-snapshots.yml after it pushes a snapshot commit
  # (pushes made with GITHUB_TOKEN do not trigger workflows).
  workflow_dispatch:

# Newer runs of the same event on the same branch cancel older ones
# (dispatch and pull_request runs do not cancel each other).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'skip-snapshots'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'skip-snapshots'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'skip-snapshots')
    env:
      CI: true
      # Label `skip-snapshots` on the PR: functional tests only, no snapshot comparison
      SKIP_SNAPSHOTS: ${{ contains(github.event.pull_request.labels.*.name, 'skip-snapshots') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      # Tests tagged @prototype (render a prototype page) never compare snapshots until T17.
      - name: Run Playwright tests (snapshots compared)
        run: |
          FLAGS=""
          if [ "$SKIP_SNAPSHOTS" = "true" ]; then FLAGS="--ignore-snapshots"; fi
          npx playwright test --project=chromium --grep-invert @prototype $FLAGS

      - name: Run Playwright tests (@prototype, snapshots ignored)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-prototypes
        run: npx playwright test --project=chromium --grep @prototype --ignore-snapshots

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-prototypes/
          retention-days: 1
