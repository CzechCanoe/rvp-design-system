name: Skip-snapshots label

# Adding/removing the `skip-snapshots` label re-runs CI with/without --ignore-snapshots.
# Kept separate from ci.yml so that other labels never start (or cancel) CI runs.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch CI for skip-snapshots
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ github.event.label.name }}
      ACTION: ${{ github.event.action }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Gated per step (not per job) so unrelated labels leave no skipped check run behind.
      - name: Dispatch CI
        run: |
          if [ "$LABEL" != "skip-snapshots" ] || [ "$SAME_REPO" != "true" ]; then
            echo "Label '$LABEL' is irrelevant (or fork PR); nothing to do."
            exit 0
          fi
          SKIP=false
          if [ "$ACTION" = "labeled" ]; then SKIP=true; fi
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$HEAD_REF" -f skip_snapshots="$SKIP"
