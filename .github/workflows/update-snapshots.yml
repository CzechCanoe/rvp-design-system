name: Update snapshots

# Regenerates chromium Playwright snapshots on the CI environment (the only authority;
# ARM/RPi renders differently). Triggered by label `update-snapshots` on a PR (mode changed)
# or manually (workflow_dispatch, input mode: changed | all).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update (default - the branch the workflow is dispatched on)
        required: false
        type: string
      mode:
        description: >-
          Playwright --update-snapshots mode. changed (default, same as the label) rewrites only
          snapshots that fail the comparison; all rewrites every snapshot, e.g. after a token change
          below the pixel threshold, so the baselines show the real colours.
        required: false
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: write
  issues: write
  pull-requests: write # required to remove the label from a PR (issues: write alone gives 403)
  actions: write

concurrency:
  group: update-snapshots-${{ github.event.pull_request.head.ref || inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update snapshots (CI)
    runs-on: ubuntu-latest
    # Same-repo PRs only (GITHUB_TOKEN is read-only for forks)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-snapshots' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      CI: true
      BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      # Snapshot/functional test failures are tolerated in update mode (the CI job reports them),
      # but a crashed run (Storybook down, Playwright error) must fail the job: the JSON report
      # has to exist and contain at least one executed test.
      # Label flow: always `changed`; workflow_dispatch may pass mode=all.
      - name: Update snapshots (chromium)
        env:
          MODE: ${{ inputs.mode || 'changed' }}
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=results-all.json npx playwright test --project=chromium --update-snapshots="$MODE" --reporter=json,line || true

      - name: Verify Playwright actually ran
        run: |
          for f in results-all.json; do
            node -e '
              const f = process.argv[1];
              let r;
              try { r = JSON.parse(require("fs").readFileSync(f, "utf8")); }
              catch (e) { console.error("::error::" + f + " missing or unreadable (Playwright crashed?)"); process.exit(1); }
              const s = r.stats || {};
              const ran = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0);
              console.log(f + ": ran=" + ran + " unexpected=" + (s.unexpected || 0) + " skipped=" + (s.skipped || 0));
              if (ran === 0 || (r.errors && r.errors.length)) { console.error("::error::" + f + ": no tests ran or global errors"); process.exit(1); }
            ' "$f"
          done

      - name: Commit snapshots
        id: commit
        run: |
          git add -A -- ':(glob)tests/**/*-snapshots/**/*.png'
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update snapshots (CI)"
          git push origin "HEAD:${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes with GITHUB_TOKEN do not trigger workflows, so run CI on the head explicitly.
      # Also without snapshot changes, so the head always ends with a fresh full CI run.
      - name: Run CI on the head
        if: ${{ github.event_name == 'pull_request' || steps.commit.outputs.changed == 'true' }}
        run: gh workflow run ci.yml --ref "$BRANCH"

      - name: Remove label
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-snapshots"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report-update
          path: playwright-report/
          retention-days: 1
